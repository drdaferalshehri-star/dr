<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم السمنة والوزن - عيادة د. ظافر الشهري</title>
    
    <!-- مكتبة Tailwind CSS للتصميم العصري المباشر -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- مكتبات React و React DOM عبر الـ CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- مترجم Babel لتشغيل كود React JSX مباشرة في المتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- إعداد خط متناسق وتأثيرات انتقالية -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen antialiased text-slate-800">

    <!-- الحاوية التي سيتم تشغيل تطبيق React بداخلها -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ⚠️ ضع رابط الـ Web App الخاص بك من Google Sheets هنا بين علامتي التنصيص:
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxEJP2xGcDAqQ8y_i-oSAr-Q-UOxpu2djszcp5V3RAnXgmz_2KVcmfufIRC2SUroQo/exec"; 
        
        const CLINIC_WHATSAPP = "966596866000"; // رقم الواتساب للعيادة

        // مسارات الصور المحلية المرفوعة (تأكد من مطابقة الحروف تماماً)
        const CLINIC_LOGO_URL = "https://i.postimg.cc/hG6w1GvN/IMG-4511.jpg"; 
        const FACE_LOGO_URL = "https://postimg.cc/sGsCmNSc";                     

        function App() {
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({
                gender: 'Male',
                age: '',
                weight: '',
                height: '',
                prevSurgery: 'لا',
                diseases: [],
                otherDisease: '',
                name: '',
                phone: '',
                city: 'أبها'
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const availableDiseases = [
                "السكر",
                "الضغط",
                "ارتفاع الكوليسترول / الدهون",
                " الغدة الدرقية",
                " تكيس المبايض",
                "آلام المفاصل والظهر",
                "لا يوجد",
                "أخرى"
            ];

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleCheckboxChange = (disease) => {
                setFormData(prev => {
                    const current = [...prev.diseases];
                    if (current.includes(disease)) {
                        return { ...prev, diseases: current.filter(d => d !== disease) };
                    } else {
                        return { ...prev, diseases: [...current, disease] };
                    }
                });
            };

            const weightNum = parseFloat(formData.weight) || 0;
            const heightNum = parseFloat(formData.height) || 0;
            const bmi = heightNum > 0 ? (weightNum / Math.pow(heightNum / 100, 2)).toFixed(1) : 0;

            const getBmiStatus = (val) => {
                const numericBmi = parseFloat(val);
                if (numericBmi < 18.5) return { label: "نقص في الوزن (تحت المعدل الطبيعي)", color: "text-blue-500", bg: "bg-blue-50" };
                if (numericBmi <= 24.9) return { label: "وزن طبيعي وصحي", color: "text-[#76B843]", bg: "bg-green-50" };
                if (numericBmi <= 29.9) return { label: "زيادة في الوزن", color: "text-yellow-600", bg: "bg-yellow-50" };
                if (numericBmi <= 34.9) return { label: "سمنة من الدرجة الأولى", color: "text-orange-500", bg: "bg-orange-50" };
                if (numericBmi <= 39.9) return { label: "سمنة مفرطة (الدرجة الثانية)", color: "text-red-500", bg: "bg-red-50" };
                return { label: "سمنة مفرطة جداً خطيرة (الدرجة الثالثة)", color: "text-red-700", bg: "bg-red-100" };
            };

            const bmiStatus = getBmiStatus(bmi);
            const avatarScaleX = bmi > 0 ? Math.min(Math.max(bmi / 22, 0.6), 1.7) : 1;

            const handleSubmitData = async () => {
                if (!formData.name || !formData.phone || !formData.city) {
                    alert("الرجاء تعبئة جميع البيانات المطلوبة للتواصل.");
                    return;
                }
                
                setIsSubmitting(true);
                const payload = {
                    ...formData,
                    gender: formData.gender === 'Male' ? 'ذكر' : 'أنثى',
                    bmi: bmi,
                    diseases: formData.diseases.join(', ')
                };

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setStep(6);
                } catch (error) {
                    console.error("حدث خطأ أثناء إرسال البيانات", error);
                    alert("حدث خطأ في الاتصال، سيتم نقلك لعرض نتائجك مباشرة.");
                    setStep(6);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const getWhatsAppLink = () => {
                const text = encodeURIComponent(
                    `السلام عليكم منسق عيادة الدكتور ظافر الشهري،\n\nلقد قمت للتو بإكمال تقييم السمنة والوزن عبر الإنترنت.\n\n` +
                    `*الاسم:* ${formData.name}\n` +
                    `*المدينة:* ${formData.city}\n` +
                    `*مؤشر كتلة الجسم المحسوب:* ${bmi} (${bmiStatus.label})\n` +
                    `*الوزن:* ${formData.weight} كجم | *الطول:* ${formData.height} سم\n\n` +
                    `أود مناقشة الخيارات الجراحية والعلاجية الأنسب لحالتي الصحية.`
                );
                return `https://wa.me/${CLINIC_WHATSAPP}?text=${text}`;
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-between font-sans antialiased text-slate-800">
                    
                    {/* الهيدر المطور */}
                    <header className="w-full bg-white shadow-sm border-b border-slate-100 py-3 px-6 flex justify-between items-center max-w-xl mx-auto">
                        <div className="flex items-center space-x-3 space-x-reverse">
                            <div className="w-12 h-12 flex items-center justify-center overflow-hidden bg-transparent">
                                <img 
                                    src={"https://i.postimg.cc/hG6w1GvN/IMG-4511.jpg"} 
                                    alt="شعار العيادة" 
                                    className="w-full h-full object-contain"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-tight text-[#1D2E87]">عيادة د. ظافر الشهري</h1>
                                <p className="text-[10px] text-slate-400 font-medium tracking-wider">جراحة السمنة والمناظير المتقدمة</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-4 space-x-reverse">
                            <div className="bg-[#76B843]/10 text-[#76B843] text-[11px] px-2.5 py-1 rounded-full font-semibold">
                                الخطوة {step} من 6
                            </div>
                            <div className="w-12 h-12 flex items-center justify-center border-2 border-[#1D2E87] rounded-full overflow-hidden bg-slate-50 shadow-md">
                                <img 
                                    src={"https://i.postimg.cc/Hx1zL8jF/IMG-4512.jpg"} 
                                    alt="الدكتور ظافر الشهري" 
                                    className="w-full h-full object-cover object-top"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                            </div>
                        </div>
                    </header>

                    {/* المحتوى الرئيسي للمشروع */}
                    <main className="flex-1 w-full max-w-xl bg-white mx-auto p-6 flex flex-col justify-center my-4 rounded-2xl shadow-sm border border-slate-100">
                        
                        {/* الخطوة 1 */}
{step === 1 && (
    <div className="text-center animate-fadeIn">
        {/* قمنا بتغيير الـ p-4 إلى p-0 وإلغاء الخلفية الرمادية bg-slate-50 لكي تظهر الصورة واضحة وبكامل حجمها الدائري */}
        <div className="mb-6 inline-block p-0 rounded-full overflow-hidden border-2 border-slate-200 w-24 h-24">
            <img 
                src="https://i.postimg.cc/Hx1zL8jF/IMG-4512.jpg" 
                alt="الدكتور ظافر الشهري" 
                className="w-full h-full object-cover"
            />
        </div>
        <h2 className="text-2xl font-extrabold text-[#1D2E87] tracking-tight">الدكتور ظافر الشهري</h2>
        <p className="text-sm font-semibold text-[#76B843] mt-1">استشاري جراحة السمنة والمناظير المتقدمة</p>
                                
                                <div className="my-6 space-y-2 text-right bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm">
                                    <p className="flex items-start"><span className="text-[#76B843] ml-2">•</span> استشاري الجراحة العامة وجراحة المناظير المتقدمة</p>
                                    <p className="flex items-start"><span className="text-[#76B843] ml-2">•</span> استشاري جراحة القولون والمستقيم والأورام</p>
                                    <p className="flex items-start text-slate-500 font-medium mt-2"><span className="text-[#1D2E87] ml-2">📍</span> نخدم المرضى في عياداتنا في: <span className="text-slate-800 font-bold mr-1">أبها، خميس مشيط، وجازان</span></p>
                                </div>

                                <button 
                                    onClick={() => setStep(2)}
                                    className="w-full bg-[#1D2E87] hover:bg-[#152368] text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 duration-200 text-base"
                                >
                                    ابدأ تقييم كتلة الجسم والوزن الآن
                                </button>
                            </div>
                        )}

                        {/* الخطوة 2 */}
                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn text-right">
                                <h3 className="text-xl font-bold text-[#1D2E87]">أدخل مقاييسك البدنية</h3>
                                
                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">الجنس</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            type="button"
                                            onClick={() => setFormData(p => ({ ...p, gender: 'Male' }))}
                                            className={`p-4 rounded-xl border-2 font-bold text-sm flex items-center justify-center space-x-2 space-x-reverse transition-all ${formData.gender === 'Male' ? 'border-[#1D2E87] bg-[#1D2E87]/5 text-[#1D2E87]' : 'border-slate-200 text-slate-500'}`}
                                        >
                                            <span>👨</span> <span>ذكر</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setFormData(p => ({ ...p, gender: 'Female' }))}
                                            className={`p-4 rounded-xl border-2 font-bold text-sm flex items-center justify-center space-x-2 space-x-reverse transition-all ${formData.gender === 'Female' ? 'border-[#1D2E87] bg-[#1D2E87]/5 text-[#1D2E87]' : 'border-slate-200 text-slate-500'}`}
                                        >
                                            <span>👩</span> <span>أنثى</span>
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">العمر (بالسنوات)</label>
                                    <input 
                                        type="number" name="age" value={formData.age} onChange={handleInputChange} placeholder="مثال: 32"
                                        className="w-full px-4 py-3.5 border-2 border-slate-200 rounded-xl focus:border-[#1D2E87] focus:outline-none font-semibold text-lg text-right"
                                    />
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">الوزن (كيلوجرام)</label>
                                    <input 
                                        type="number" name="weight" value={formData.weight} onChange={handleInputChange} placeholder="مثال: 95"
                                        className="w-full px-4 py-3.5 border-2 border-slate-200 rounded-xl focus:border-[#1D2E87] focus:outline-none font-semibold text-lg text-right"
                                    />
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">الطول (سنتيمتر)</label>
                                    <input 
                                        type="number" name="height" value={formData.height} onChange={handleInputChange} placeholder="مثال: 172"
                                        className="w-full px-4 py-3.5 border-2 border-slate-200 rounded-xl focus:border-[#1D2E87] focus:outline-none font-semibold text-lg text-right"
                                    />
                                </div>

                                <button 
                                    disabled={!formData.age || !formData.weight || !formData.height}
                                    onClick={() => setStep(3)}
                                    className="w-full bg-[#1D2E87] disabled:bg-slate-200 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl shadow-md transition-all mt-4"
                                >
                                    احسب وحلل مؤشر كتلتي
                                </button>
                            </div>
                        )}

                        {/* الخطوة 3 */}
                        {step === 3 && (
                            <div className="text-center space-y-6 animate-fadeIn">
                                <div>
                                    <h3 className="text-xl font-bold text-[#1D2E87]">نتائج مؤشر كتلة الجسم (BMI)</h3>
                                    <p className="text-sm text-slate-400">تجسيد مرئي تفاعلي يعكس وزنك الحالي</p>
                                </div>

                                <div className={`p-4 rounded-xl border ${bmiStatus.bg} inline-block mx-auto px-8`}>
                                    <div className="text-4xl font-black text-slate-800">{bmi}</div>
                                    <div className={`text-sm font-bold mt-1 ${bmiStatus.color}`}>{bmiStatus.label}</div>
                                </div>

                                <div className="w-full flex justify-center bg-slate-50 py-6 rounded-2xl border border-slate-100 min-h-[220px] items-center">
                                    <svg 
                                        className="h-44 text-slate-700 transition-transform duration-500 ease-out" 
                                        style={{ transform: `scaleX(${avatarScaleX})` }} 
                                        viewBox="0 0 100 200"
                                    >
                                        <circle cx="50" cy="25" r="15" fill="currentColor" opacity="0.9" />
                                        <path d="M35 45 C 35 45, 20 100, 30 140 L 70 140 C 80 100, 65 45, 65 45 Z" fill="currentColor" />
                                        <rect x="32" y="140" width="12" height="50" rx="4" fill="currentColor" />
                                        <rect x="56" y="140" width="12" height="50" rx="4" fill="currentColor" />
                                    </svg>
                                </div>

                                <div className="flex space-x-3 space-x-reverse">
                                    <button onClick={() => setStep(2)} className="w-1/3 border-2 border-slate-200 text-slate-500 font-bold py-3 rounded-xl">السابق</button>
                                    <button onClick={() => setStep(4)} className="w-2/3 bg-[#1D2E87] text-white font-bold py-3 rounded-xl shadow-md">الخطوة التالية</button>
                                </div>
                            </div>
                        )}

                        {/* الخطوة 4 */}
                        {step === 4 && (
                            <div className="space-y-5 animate-fadeIn text-right">
                                <h3 className="text-xl font-bold text-[#1D2E87]">التاريخ الطبي والمرضي</h3>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">هل أجريت عمليات سمنة سابقة؟</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        {['نعم', 'لا'].map((opt) => (
                                            <button
                                                key={opt} type="button" onClick={() => setFormData(p => ({ ...p, prevSurgery: opt }))}
                                                className={`p-3.5 rounded-xl border-2 font-bold text-sm transition-all ${formData.prevSurgery === opt ? 'border-[#1D2E87] bg-[#1D2E87]/5 text-[#1D2E87]' : 'border-slate-200 text-slate-500'}`}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">هل تعاني من أي من المشاكل الصحية التالية؟</label>
                                    <div className="space-y-2 max-h-60 overflow-y-auto pl-1">
                                        {availableDiseases.map((disease) => {
                                            if (disease.includes("PCOS") && formData.gender === "Male") return null;

                                            return (
                                                <label key={disease} className={`flex items-center space-x-3 space-x-reverse p-3 border rounded-xl cursor-pointer transition-all ${formData.diseases.includes(disease) ? 'border-[#76B843] bg-[#76B843]/5' : 'border-slate-100 hover:bg-slate-50'}`}>
                                                    <input 
                                                        type="checkbox" checked={formData.diseases.includes(disease)} onChange={() => handleCheckboxChange(disease)}
                                                        className="rounded text-[#76B843] focus:ring-[#76B843] w-4 h-4 accent-[#76B843]"
                                                    />
                                                    <span className="text-sm font-semibold text-slate-700">{disease}</span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>

                                {formData.diseases.includes("أخرى") && (
                                    <div className="animate-slideDown">
                                        <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">الرجاء تحديد الحالات الصحية الأخرى</label>
                                        <textarea 
                                            name="otherDisease" value={formData.otherDisease} onChange={handleInputChange} rows="2" placeholder="اكتب أي معلومات طبية إضافية هامة هنا..."
                                            className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-[#1D2E87] focus:outline-none font-medium text-sm text-right"
                                        />
                                    </div>
                                )}

                                <div className="flex space-x-3 space-x-reverse pt-2">
                                    <button onClick={() => setStep(3)} className="w-1/3 border-2 border-slate-200 text-slate-500 font-bold py-3 rounded-xl">السابق</button>
                                    <button onClick={() => setStep(5)} className="w-2/3 bg-[#1D2E87] text-white font-bold py-3 rounded-xl shadow-md">متابعة التقييم</button>
                                </div>
                            </div>
                        )}

                        {/* الخطوة 5 */}
                        {step === 5 && (
                            <div className="space-y-5 animate-fadeIn text-right">
                                <div>
                                    <h3 className="text-xl font-bold text-[#1D2E87]">طلب استشارة طبية آمنة</h3>
                                    <p className="text-sm text-slate-400">الرجاء تزويدنا بمعلومات الاتصال الخاصة بك لحفظ مؤشراتك بدقة ومراجعتها من قبل الفريق المختص.</p>
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">الاسم الكامل</label>
                                    <input 
                                        type="text" name="name" value={formData.name} onChange={handleInputChange} placeholder="مثال: محمد أحمد"
                                        className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-[#1D2E87] focus:outline-none font-semibold text-right"
                                    />
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">رقم الجوال</label>
                                    <input 
                                        type="tel" name="phone" value={formData.phone} onChange={handleInputChange} placeholder="مثال: 055XXXXXXX"
                                        className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-[#1D2E87] focus:outline-none font-semibold tracking-wider text-left text-right"
                                    />
                                </div>

                                <div>
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">أقرب عيادة إليك</label>
                                    <select 
                                        name="city" value={formData.city} onChange={handleInputChange}
                                        className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl bg-white focus:border-[#1D2E87] focus:outline-none font-semibold text-right"
                                    >
                                        <option value="أبها">أبها</option>
                                        <option value="خميس مشيط">خميس مشيط</option>
                                        <option value="جازان">جازان</option>
                                    </select>
                                </div>

                                <div className="flex space-x-3 space-x-reverse pt-2">
                                    <button onClick={() => setStep(4)} className="w-1/3 border-2 border-slate-200 text-slate-500 font-bold py-3 rounded-xl" disabled={isSubmitting}>السابق</button>
                                    <button 
                                        onClick={handleSubmitData} disabled={isSubmitting || !formData.name || !formData.phone}
                                        className="w-2/3 bg-[#76B843] hover:bg-[#629c35] text-white font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2 space-x-reverse"
                                    >
                                        {isSubmitting ? (
                                            <span>جاري الحفظ...</span>
                                        ) : (
                                            <><span>عرض النتائج</span> <span>←</span></>
                                        )}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* الخطوة 6 */}
                        {step === 6 && (
                            <div className="text-center space-y-6 animate-fadeIn">
                                <div className="w-16 h-16 bg-[#76B843]/10 text-[#76B843] rounded-full flex items-center justify-center mx-auto text-2xl">
                                    ✓
                                </div>

                                <div>
                                    <h3 className="text-2xl font-black text-[#1D2E87]">تم حفظ تقييمك بنجاح!</h3>
                                    <p className="text-slate-500 text-sm mt-1">تمت مزامنة تقريرك الطبي بدقة وأمان مع منسق عيادتنا لمراجعة الخيارات الطبية المناسبة لك.</p>
                                </div>

                                <div className="bg-slate-50 border border-slate-100 p-5 rounded-2xl text-right space-y-2">
